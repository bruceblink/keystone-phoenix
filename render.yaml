services:
  - type: web
    name: keystone-phoenix
    runtime: image
    image:
      url: ghcr.io/bruceblink/keystone-phoenix:1.0.0
    region: oregon
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: PHX_SERVER
        value: "true"
      - key: PHX_FORCE_SSL
        value: "true"
      - key: PHX_ALLOW_INSECURE_HTTP
        value: "false"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_ALLOW_INSECURE
        value: "false"
      - key: FILE_BASE_DIR
        value: /var/lib/keystone/resources
      - key: POOL_SIZE
        value: "5"
      - key: JOB_SCHEDULER_ENABLED
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: MFA_MASTER_KEY
        generateValue: true
      - key: MFA_MASTER_KEY_VERSION
        value: "1"
      - key: MFA_RECOVERY_PEPPER
        generateValue: true
      - key: JWT_KEY_ID
        value: render-v1
      - key: PHX_HOST
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
