name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keystone_phoenix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keystone_phoenix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: keystone_phoenix_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.5
          otp-version: 29.1.2
          version-type: strict
          install-hex: true
          install-rebar: true

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-elixir-1.20.5-otp-29.1.2-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-elixir-1.20.5-otp-29.1.2-
            ${{ runner.os }}-beam-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting and source limits
        run: |
          mix format --check-formatted
          mix check.source_lines

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run unit and database tests
        run: mix test

      - name: Report test coverage baseline
        run: mix test --cover --include integration

      - name: Run LiveView integration tests
        run: mix test --include integration
