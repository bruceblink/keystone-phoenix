name: Build and publish release image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release-image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release images require a stable semantic version tag such as v0.3.0" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce source file size limit
        run: ./scripts/check_source_lines.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign release image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Pull release image for smoke test
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ steps.metadata.outputs.version }}
        run: docker pull "${IMAGE_REF}"

      - name: Run release smoke test
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ steps.metadata.outputs.version }}
        run: ./scripts/release_smoke.sh "${IMAGE_REF}"

      - name: Generate release notes
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          previous="$(git tag --sort=-version:refname --list 'v*' | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          {
            echo "keystone-phoenix ${GITHUB_REF_NAME#v}"
            if [[ -n "${previous}" ]]; then
              echo "对比范围：${previous}..${GITHUB_REF_NAME}"
            fi
            echo "镜像：ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"
            echo "镜像摘要：${IMAGE_DIGEST}"
            echo ""
            echo "🚀 新功能 / Features"
            git log --format='- %s' ${previous:+"${previous}.."}${GITHUB_REF_NAME} --grep='^feat' || true
            echo ""
            echo "🐛 问题修复 / Bug Fixes"
            git log --format='- %s' ${previous:+"${previous}.."}${GITHUB_REF_NAME} --grep='^fix' || true
            echo ""
            echo "🧰 维护、文档与测试 / Maintenance, Docs & Tests"
            git log --format='- %s' ${previous:+"${previous}.."}${GITHUB_REF_NAME} --grep='^\(chore\|docs\|test\|ci\|build\|refactor\)' || true
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Keystone Phoenix ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
